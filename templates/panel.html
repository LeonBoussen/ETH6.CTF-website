<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Panel</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      nav.navbar {
        background: #183153;
        color: #fff;
        padding: 1em 0;
      }
      .logo {
        font-weight: bold;
        font-size: 1.4em;
        margin-left: 1em;
      }
      .container {
        width: 90%;
        margin: 0 auto;
      }
      section.panel {
        margin: 2em 0;
        padding: 2em;
        background: #f5f5f5;
        border-radius: 8px;
      }
      footer {
        background: #24406c;
        color: #fff;
        padding: 1em;
        text-align: center;
      }
      dialog {
        border: 1px solid #666;
        border-radius: 6px;
        padding: 2em 2.5em;
        font-size: 1.1em;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
    </style>
</head>
<body>
    <dialog id="helloPopup">
        <h2>You got the flag!!!</h2>
        <p>Bombo{flagring_of_3cfound25}</p>
        <button id="closePopup">Close</button>
    </dialog>
    <nav class="navbar">
      <div class="container">
        <div class="logo">SecureBank</div>
      </div>
    </nav>
    <section class="panel">
        <div class="container">
            <h1>Welcome to the Employee Panel</h1>
            <p>This is a placeholder page for authorized employees. Features coming soon.</p>
        </div>
    </section>
    <footer>
        <div class="container">
            <p>&copy; 2025 SecureBank Global. All rights reserved.</p>
        </div>
    </footer>
    <script>
      // Show dialog on page load
      window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('helloPopup').showModal();
      });

      // Close dialog
      document.getElementById('closePopup').addEventListener('click', function() {
        document.getElementById('helloPopup').close();
      });
    </script>
</body>
</html>
